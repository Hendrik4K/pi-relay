# Pi Relay: virtuelles Mikrofon „Windows-Mikrofon“ / virtual microphone "Windows-Mikrofon".
# Pi Relay schickt das Mikrofon des Windows-PCs über SSH (kein offener Port) als rohes PCM
# an ~/.local/bin/windows-mikro-empfang, das es mit pw-cat hier hineinspielt.
# Programme auf dem Pi sehen es als normale Mikrofon-Quelle.
# Ablegen unter / put it in: ~/.config/pipewire/pipewire.conf.d/windows-mikrofon.conf, dann / then
# „systemctl --user restart pipewire“. Entfernen / remove: diese Datei löschen und PipeWire neu starten.
context.objects = [
  { factory = adapter
    args = {
      factory.name     = support.null-audio-sink
      node.name        = "windows-mikrofon"
      node.description = "Windows-Mikrofon (Pi Relay)"
      media.class      = Audio/Source/Virtual
      audio.position   = [ MONO ]
      audio.rate       = 48000
      object.linger    = true
    }
  }
]